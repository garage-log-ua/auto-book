<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Авто · сервісна книжка</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Roboto+Condensed:wght@500;700&display=swap">
<style>
/* Layout: dashboard first. Floating pill nav + three-bar button with speed-dial. Forms open as bottom sheets. Blue accent, light and dark. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#161b24; --muted:#5d6879; --line:#d5dbe5;
  --accent:#1677ff; --accent-ink:#ffffff; --accent-soft:#e3eeff;
  --warn:#b45309; --bad:#c62828; --ok:#15803d;
  --c-fuel:#10b981; --c-svc:#f59e0b; --c-km:#06b6d4; --c-exp:#ec4899; --c-rem:#a3560b; --c-car:#1677ff;
  --shadow:0 10px 30px rgba(20,40,80,.14);
  --f-display:"Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --ink:#e7eaee; --muted:#8d96a3; --line:#2a2f38;
    --accent:#3d8bff; --accent-ink:#ffffff; --accent-soft:#16253d;
    --warn:#f0b429; --bad:#f87171; --ok:#4ade80; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --ink:#e7eaee; --muted:#8d96a3; --line:#2a2f38;
  --accent:#3d8bff; --accent-ink:#ffffff; --accent-soft:#16253d;
  --warn:#f0b429; --bad:#f87171; --ok:#4ade80; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;
  padding-block:0 calc(env(safe-area-inset-bottom,0px) + 128px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
h1{font:700 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
h2{font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.09em;margin:0;color:var(--muted);display:flex;align-items:center;gap:8px}
h2 .ic{color:var(--accent)}
.page{display:none}.page.on{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>*{min-width:0}
@media (max-width:440px){.grid.r1{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.03em}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px;width:100%;min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;line-height:44px}
textarea{height:auto;line-height:1.4;padding:10px 12px;resize:vertical}
input[type=date],input[type=month]{padding-right:6px;text-align:left;overflow:hidden}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;min-width:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;text-overflow:ellipsis}
input[type=file]{height:auto;padding:10px;font-size:13px;line-height:1.3}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px var(--f-body);border-radius:10px;padding:0 14px;min-height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover{border-color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.sm{min-height:34px;padding:0 10px;font-size:12px}
button.link{border:0;background:transparent;color:var(--accent);padding:0;min-height:0;font-weight:600}
label.fbtn{font:600 14px var(--f-body);color:var(--ink);letter-spacing:0;border:1px solid var(--line);border-radius:10px;min-height:42px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:var(--surface)}
.m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.t{font-weight:600;overflow-wrap:anywhere}
.n{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
.warn{color:var(--warn);font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad);font-weight:600}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.list>li:first-child{border-top:0}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mh{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mh span:last-child{font-family:var(--f-mono);font-weight:500;letter-spacing:0;text-transform:none}
.photo{max-width:100%;border-radius:10px;margin-top:8px;display:block;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 13px;min-height:34px;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;min-height:36px;border-radius:9px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.found{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:230px;overflow:auto}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick:hover{background:var(--accent-soft)}
.checks{display:flex;flex-direction:column;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.checks label{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);letter-spacing:0;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.checks label:last-child{border-bottom:0}
.checks input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;padding:0;margin:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
.result{border:1px dashed var(--line);border-radius:10px;padding:12px;font-weight:500}
details.day{border-top:1px solid var(--line)}
details.day summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 0}
details.day summary::-webkit-details-marker{display:none}
details.day summary .d{font-weight:600}
details.day summary .n{color:var(--muted)}
details.day .body{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
/* dashboard */
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 56px;overflow:hidden;padding:0}
.logo img{width:100%;height:100%;object-fit:cover}
.logo .ic{width:30px;height:30px}
.hmain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:block;min-height:0;cursor:pointer;color:inherit}
.hname{font:700 20px/1.15 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.hspec{font-size:12.5px;color:var(--muted);margin-top:2px}
.bell{position:relative;width:46px;height:46px;padding:0;border-radius:14px;flex:0 0 46px}
.bell b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/20px var(--f-body);text-align:center;padding:0 5px}
.hfuel{display:flex;justify-content:space-between;color:var(--muted);font-weight:500}
.hfuel b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.gauge{height:8px;border-radius:99px;background:color-mix(in srgb,var(--muted) 25%,transparent);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:18px}
.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;border:0;background:transparent;border-radius:18px;padding:14px;text-align:left;min-height:104px;color:var(--ink)}
.tile+.tile{border-left:1px solid var(--line);border-radius:0 18px 18px 0}
.th{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.th .ic{color:var(--accent)}
.th .ic:last-child{margin-left:auto;color:var(--muted);width:16px;height:16px}
.tv{font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tv u{font:400 13px var(--f-body);text-decoration:none;color:var(--muted);margin-left:3px}
.tile .m{margin-top:-2px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sech h3{margin:0;font:700 20px var(--f-display);letter-spacing:.03em}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.fcard .th .ic{color:var(--c-fuel)}
.fcard .big{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.evl{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:10px 12px}
.evi{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:flex;align-items:center;justify-content:center}
.evr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pchart{width:100%;height:auto;display:block}
.pchart .gl{stroke:var(--line);stroke-width:1}
.pchart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.pchart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.pchart .pe{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.pchart text{fill:var(--muted);font:11px var(--f-mono)}
/* vehicles */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.vtop{display:flex;gap:12px;align-items:flex-start}
.vtop .logo{width:76px;height:76px;flex:0 0 76px;border-radius:18px}
.vinfo{flex:1;min-width:0}
.vinfo b{font:700 19px/1.2 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.vodo{font:700 28px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.vodo u{font:400 13px var(--f-body);text-decoration:none;color:var(--muted);margin-left:3px}
.dots{width:38px;min-height:38px;padding:0;border:0;background:transparent;color:var(--muted)}
.vmenu{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;border-top:1px solid var(--line);padding-top:12px}
.vgrid .k{font-size:12px;color:var(--muted)}
.vgrid .v{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 8px;border:1px solid var(--accent);color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.brow .tr{height:10px;border-radius:99px;background:color-mix(in srgb,var(--muted) 20%,transparent);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.bar2{display:flex;align-items:flex-end;gap:6px;overflow:auto;padding-top:8px}
.bar2>div{display:flex;flex-direction:column;align-items:center;width:28px;flex:0 0 28px;font-size:10px;color:var(--muted)}
.bar2 i{display:block;width:18px;background:var(--accent);border-radius:5px 5px 2px 2px;margin:2px 0}
/* bottom nav + fab */
.nav{position:fixed;z-index:40;left:calc(12px + env(safe-area-inset-left,0px));right:calc(86px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;height:62px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;padding:6px}
.nav button{border:0;background:transparent;border-radius:18px;height:50px;min-height:50px;padding:0;flex:1 1 0;min-width:0;color:var(--muted);font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;position:relative}
.nav button .ic{width:24px;height:24px}
.nav button .lb{display:none}
.nav button.on{flex:2.2 1 0;background:var(--accent-soft);color:var(--accent)}
.nav button.on .lb{display:inline}
.nav button.on::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:3px;margin-left:-13px;border-radius:3px;background:var(--accent)}
#fab{position:fixed;z-index:62;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:62px;height:62px;padding:0;border-radius:50%;background:var(--accent);border:0;color:var(--accent-ink);box-shadow:0 8px 22px rgba(22,119,255,.4),0 2px 6px rgba(0,0,0,.25)}
#fab:hover{border:0}
#fab .bars3{position:relative;width:22px;height:16px;display:block}
#fab .bars3 i{position:absolute;left:0;width:22px;height:2.5px;border-radius:2px;background:currentColor;transition:transform .2s,opacity .2s,top .2s}
#fab .bars3 i:nth-child(1){top:0}#fab .bars3 i:nth-child(2){top:6.7px}#fab .bars3 i:nth-child(3){top:13.4px}
#fab[aria-expanded=true] .bars3 i:nth-child(1){top:6.7px;transform:rotate(45deg)}
#fab[aria-expanded=true] .bars3 i:nth-child(2){opacity:0}
#fab[aria-expanded=true] .bars3 i:nth-child(3){top:6.7px;transform:rotate(-45deg)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.dial{position:fixed;z-index:61;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.dial button{border:0;background:transparent;padding:0;min-height:0;gap:14px;flex-direction:row;color:var(--ink);animation:rise .18s ease-out both}
.dial button:hover{border:0}
.dial .lab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;font:700 17px var(--f-body);box-shadow:var(--shadow)}
.dial .tile2{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow)}
.dial .tile2 .ic{width:28px;height:28px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.more{position:fixed;z-index:61;right:calc(86px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(268px,calc(100vw - 110px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:rise .16s ease-out both}
.more button{width:100%;justify-content:flex-start;gap:16px;border:0;border-top:1px solid var(--line);border-radius:0;min-height:56px;padding:0 18px;font-size:16px;font-weight:500}
.more button:first-child{border-top:0}
.more button .ic{color:var(--muted);width:24px;height:24px}
.more button[aria-current=page]{color:var(--accent)}
.more button[aria-current=page] .ic{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.dial button,.more,.msheet{animation:none}#fab .bars3 i{transition:none}}
/* sheets */
.modal{position:fixed;inset:0;z-index:80}
.modal.l2{z-index:90}
.modal .mscrim{position:absolute;inset:0;background:rgba(10,14,22,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.msheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out both;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mh2{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px)) 14px;border-bottom:1px solid var(--line);border-radius:26px 26px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--accent)) 16%,var(--bg)),var(--bg))}
.mh2 .x{border:0;background:transparent;width:38px;min-height:38px;padding:0;color:var(--muted)}
.mh2 .hi{color:var(--c,var(--accent));display:flex}
.mh2 h3{margin:0;font:700 21px var(--f-display);letter-spacing:.03em}
.mbody{overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.mft{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.mft button{flex:1;min-height:48px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card2>h4{margin:0;font:700 16px var(--f-display);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card2>h4::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--accent)}
.opt{display:flex;align-items:center;gap:14px;width:100%;justify-content:flex-start;min-height:62px;border-radius:18px;padding:0 16px;font-size:16px;text-align:left;background:var(--surface)}
.opt .ic{width:30px;height:30px}
.opt .rd{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.opt[aria-checked=true]{background:var(--accent-soft);border-color:var(--accent)}
.opt[aria-checked=true] .rd{border-color:var(--accent);color:var(--accent)}
.opt .rd .ic{width:14px;height:14px}
.opt .rd .ic{display:none}.opt[aria-checked=true] .rd .ic{display:block}
.ach{align-items:center;text-align:center;padding:10px 0 4px}
.ach .big{width:100px;height:100px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.ach .big .ic{width:54px;height:54px}
.ach h4{margin:8px 0 0;font:700 28px var(--f-display)}
.sel{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;width:100%;font-weight:500;font-size:16px;min-height:46px}
/* preview + toast */
#view{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#view .in{max-width:640px;margin:0 auto}
#view .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px}
#view .doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto}
#view h1{font-size:20px;margin-bottom:6px}
#view table{border-collapse:collapse;min-width:100%}
#view th,#view td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
#view th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#view img{max-width:160px;border-radius:6px;display:block}
#toast{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:560px;margin:0 auto;z-index:120;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-weight:500}
#toast.err{border-left-color:var(--bad)}
#toast .ic{color:var(--ok)}#toast.err .ic{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* ===== Drayvo-style redesign ===== */
:root{--bg:#f2f2f3;--surface:#fff;--ink:#14161a;--muted:#6b7280;--line:#e7e9ee;--accent:#1f6feb;--accent-soft:#dce9fd;--shadow:0 8px 28px rgba(20,30,50,.08);--ac2:#ef6c00;--f-display:"Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent-soft:#16253d}}
body{font-size:16px}
h1{font:700 30px/1.1 var(--f-display);text-transform:none;letter-spacing:-.01em}
header.top{background:var(--bg);border-bottom:0;padding:18px 0 8px}
h2{font:600 16px var(--f-display);text-transform:none;letter-spacing:0;color:var(--ink)}
.panel,.card2,.vcard,.fcard,.tiles,.hero,.ev,.msheet .opt{border:0;border-radius:26px;box-shadow:none}
.ev{border-left:0;border-radius:22px}.tile+.tile{border-left:1px solid var(--line)}
.hero{background:var(--surface)}
.hname{font:700 22px/1.15 var(--f-display);letter-spacing:0}
.card2>h4{font:600 16px var(--f-display);letter-spacing:0}
input,select,textarea{border-radius:16px;background:var(--surface)}
.card2 input,.card2 select,.card2 textarea,.panel input,.panel select,.panel textarea{background:var(--bg);border-color:transparent}
select{border-radius:99px}
button{border-radius:99px}button.p{border-radius:99px}button.sm{border-radius:99px}
.nav{border-radius:34px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.nav button{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:600;font-size:15px;border-radius:26px}
#fab{background:var(--ac2);border:2px solid var(--accent)}
.msheet{border-radius:30px 30px 0 0}.mh2{background:var(--bg);border-radius:30px 30px 0 0}.mh2 h3{font:700 22px var(--f-display);letter-spacing:0}
.seg{border-radius:99px;border:0}.seg button{text-transform:none;letter-spacing:0;font-size:14px;border-radius:99px}.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sgroup{background:var(--surface);border-radius:28px;overflow:hidden}
.srow{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:12px 18px;border:0;border-radius:0;background:transparent;justify-content:flex-start;text-align:left;font-weight:400}
.srow+.srow{border-top:0}.srow b{display:block;font-weight:600;font-size:17px}.srow .m{display:block}.srow .ic{width:26px;height:26px;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:64px}.lrow .ic{color:var(--muted);width:24px;height:24px}
.pillsel{width:auto;max-width:58%;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--surface)!important;font-size:16px}
.sw{width:52px;height:30px;min-height:30px;border-radius:99px;background:var(--line);position:relative;padding:0;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{left:25px}
.swatch{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.bi{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 12px var(--f-body);flex:0 0 34px}
.brow2{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 14px;border:0;border-radius:0;background:transparent;justify-content:flex-start;text-align:left;font-weight:500}
.brow2+.brow2{border-top:1px solid var(--line)}.brow2 .m{margin-left:auto}
.vmenu{display:flex;flex-wrap:wrap;gap:8px}
img{cursor:zoom-in}.logo img,.nolb{cursor:pointer}
.pv{display:block;max-height:120px;border-radius:14px;margin-top:8px}
#lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain;cursor:zoom-out}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:#fff3;color:#fff;border:0;width:44px;padding:0}
.mbody>*{flex-shrink:0}.mbody{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
.pk{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;text-overflow:ellipsis}
</style>

function curCar() {

function odoNow(c) {
  if (!c) return 0;
  let m = num(c.odo);
  state.fuels.concat(state.services).forEach(x => { if (String(x.carId) === String(c.id) && x.km > m) m = x.km; });
  return m;
}
function avgFor(c) {
  if (!c) return null;
  const f = state.fuels.filter(x => String(x.carId) === String(c.id) && x.km > 0).sort((a,b) => a.km - b.km);
  const fl = f.filter(x => x.full !== false);
  if (fl.length >= 2) {
    const km = fl[fl.length-1].km - fl[0].km;
    const l = f.filter(x => x.km > fl[0].km && x.km <= fl[fl.length-1].km).reduce((s,x) => s + x.liters, 0);
    if (km > 0 && l > 0) return l / km * 100;
  }
  const k = state.kms.filter(x => String(x.carId) === String(c.id));
  const sk = k.reduce((s,x) => s + (+x.km||0), 0), sf = k.reduce((s,x) => s + (+x.fuel||0), 0);
  return sk > 0 && sf > 0 ? sf / sk * 100 : null;
}
function lastFuel(c) {
  const f = state.fuels.filter(x => String(x.carId) === String(c.id)).sort((a,b) => String(b.date).localeCompare(String(a.date)) || (b.km - a.km));
  return f[0] || null;
}
function monthKm(c) {
  const m = today().slice(0,7);
  return state.kms.filter(k => String(k.carId) === String(c.id) && String(k.date||'').startsWith(m)).reduce((s,k) => s + (+k.km||0), 0);
}
function forecast(c) {
  const avg = avgFor(c), last = lastFuel(c);
  if (!avg || !c.tank || !last || !last.km) return null;
  const range = c.tank / avg * 100;
  const target = last.km + range;
  const odo = odoNow(c);
  const left = Math.max(0, Math.round(target - odo));
  let when = '';
  const f = state.fuels.filter(x => String(x.carId) === String(c.id) && x.km > 0).sort((a,b) => String(a.date).localeCompare(String(b.date)));
  if (f.length >= 2) {
    const days = (new Date(f[f.length-1].date) - new Date(f[0].date)) / 86400000;
    const km = f[f.length-1].km - f[0].km;
    if (days > 0 && km > 0) {
      const d = new Date(); d.setDate(d.getDate() + Math.round(left / (km / days)));
      when = fdate(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'));
    }
  }
  return { target: Math.round(target), left, when };
}

function priceChart(list) {
  const pts = list.filter(f => f.liters > 0 && f.sum > 0).sort((a,b) => String(a.date).localeCompare(String(b.date))).map(f => ({d:f.date, p:f.sum / f.liters}));
  if (pts.length < 2) return '<div class="empty" style="text-align:center;padding:26px 0">Немає даних про ціни</div>';
  const W = 320, H = 150, L = 38, R = 10, T = 10, B = 24;
  let lo = Math.min(...pts.map(p => p.p)), hi = Math.max(...pts.map(p => p.p));
  if (hi - lo < 0.5) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = (i) => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));

function compressImage(file, done) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900; let w = img.width, h = img.height;
      if (w > max || h > max) { if (w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      done(cv.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => done('');
    img.src = r.result;
  };
  r.onerror = () => done('');
  r.readAsDataURL(file);
}
function calcFuel() {
  const dist = num($('calcDist').value), avg = num($('calcAvg').value), l = num($('calcLiters').value), out = $('calcResult');
  let t;
  if (avg <= 0) t = 'Вкажи середню витрату';
  else if (dist > 0) t = `На ${dist} км потрібно приблизно ${(dist * avg / 100).toFixed(1)} л`;
  else if (l > 0) t = `На ${l} л можна проїхати приблизно ${(l / avg * 100).toFixed(0)} км`;
  else t = 'Вкажи відстань або літри';
  out.textContent = t; out.hidden = false;
}

let dlCap;
async function getDl() {
  if (dlCap !== undefined) return dlCap;
  try { dlCap = (window.claude && await window.claude.use('downloads')) || null; } catch (e) { dlCap = null; }
  return dlCap;
}
async function saveFile(name, data) {
  const d = await getDl();
  if (!d) {
    try {
      const mime = /\.json$/.test(name) ? 'application/json' : /\.csv$/.test(name) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8';
      const blob = new Blob([data], { type: mime }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Файл завантажено');
    } catch (e) {
      try { await navigator.clipboard.writeText(typeof data === 'string' ? data : ''); toast('Не вдалося завантажити. Вміст скопійовано.', true); }
      catch (e2) { toast('Не вдалося завантажити файл.', true); }
    }
    return;
  }
  try { await d.save({ filename: name, data }); toast('Файл збережено'); }
  catch (e) { if (e && e.code === 'declined') return; toast('Не вдалося зберегти файл', true); }
}
function backup() { saveFile('auto-backup.json', JSON.stringify(state, null, 2)); }
function restore(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.cars)) throw new Error('bad');
      state = Object.assign({}, data); normalize(); curCar(); persist(); render();
      toast('Бекап відновлено');
    } catch (e) { toast('Не вдалося прочитати файл', true); }
    input.value = '';
  };
  r.readAsText(file);
}
