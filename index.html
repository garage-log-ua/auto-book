<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>Авто · сервісна книжка</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e0d6; --accent:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:84px; }
  header { padding:18px 64px 6px 16px; display:flex; justify-content:space-between; align-items:end; }
  h1 { margin:0; font-size:28px; }
  .muted { color:var(--muted); font-size:13px; }
  .wrap { padding:12px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  input, select, textarea { width:100%; max-width:100%; box-sizing:border-box; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:16px; margin:6px 0; background:#fff; }
  input[type="date"] {
    display:block;
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    -webkit-appearance:none;
    appearance:none;
    text-align:left;
    overflow:hidden;
  }
  button { border:0; border-radius:12px; padding:12px 14px; background:#1c1917; color:#fff; font-size:15px; }
  button.ghost { background:#ffedd5; color:#9a3412; }
  button.danger { background:#fee2e2; color:#b91c1c; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .warn { color:#c2410c; font-weight:700; }
  .ok { color:#15803d; }
  nav { position:fixed; left:0; right:0; bottom:0; background:#1c1917; display:flex; }
  nav button { flex:1; background:transparent; color:#d6d3d1; border-radius:0; padding:14px 0 18px; }
  nav button.on { color:#fff; font-weight:700; }
  .page { display:none; } .page.on { display:block; }
  .checks { display:flex; flex-direction:column; gap:0; margin:8px 0 12px; max-height:320px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .checks label { display:flex; flex-direction:row; align-items:center; gap:10px; font-size:15px; padding:10px 12px; border-bottom:1px solid var(--line); margin:0; }
  .checks label:last-child { border-bottom:0; }
  .checks input[type="checkbox"] { width:20px; height:20px; margin:0; flex:0 0 20px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Авто</h1>
    <div class="muted">Сервісна книжка і нагадування</div>
  </div>
</header>

<div class="page on" id="p-cars">
  <div class="wrap" id="cars"></div>
  <div class="wrap">
    <div class="card">
      <b>Пошук авто</b>
      <input id="carSearch" placeholder="Марка або модель, напр. Octavia" oninput="searchCars()">
      <div id="carResults"></div>
    </div>
    <div class="card">
      <b>Додати своє</b>
      <input id="carName" placeholder="Назва, напр. Skoda Octavia">
      <input id="carPlate" placeholder="Номер">
      <input id="carYear" placeholder="Рік" inputmode="numeric">
      <button onclick="addCar()">Додати</button>
    </div>
    <div class="card">
      <b>Бекап</b>
      <div class="muted">Збережи дані файлом і зможеш відновити їх пізніше</div>
      <div class="btns">
        <button class="ghost" onclick="backup()">Зберегти бекап</button>
        <label class="ghost" style="display:inline-block;padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;">
          Відновити
          <input id="restoreFile" type="file" accept="application/json,.json" style="display:none;" onchange="restore(this)">
        </label>
      </div>
    </div>
  </div>
</div>

<div class="page" id="p-service">
  <div class="wrap">
    <select id="svcCar" onchange="render()"></select>
    <div class="card">
      <b>Новий запис</b>
      <select id="svcType" onchange="renderChecks()">
        <option value="to">ТО</option>
        <option value="hodova">Ремонт ходової</option>
        <option value="galma">Гальма</option>
        <option value="ridyny">Рідини і ремені</option>
        <option value="inshi">Інше</option>
      </select>
      <div class="checks" id="svcChecks"></div>
      <div id="pickedBox" class="muted" style="margin:8px 0;"></div>
      <button class="ghost" onclick="viewPicked()">Переглянути вибір</button>
      <input id="svcDate" type="date">
      <input id="svcKm" placeholder="Пробіг, км" inputmode="numeric">
      <input id="svcNote" placeholder="Примітка (необовʼязково)">
      <input id="svcCost" placeholder="Сума, грн" inputmode="numeric">
      <input id="svcPhoto" type="file" accept="image/*">
      <div class="muted">Фото чеку</div>
      <button onclick="addService()">Зберегти</button>
      <div class="btns">
        <button class="ghost" onclick="saveServiceReport('html')">Звіт HTML</button>
        <button class="ghost" onclick="saveServiceReport('excel')">Звіт Excel</button>
        <button class="ghost" onclick="saveServiceReport('view')">Переглянути</button>
      </div>
    </div>
    <div id="svcList"></div>
  </div>
</div>

<div class="page" id="p-remind">
  <div class="wrap">
    <div class="card">
      <b>Нагадування</b>
      <input id="remTitle" placeholder="Страховка, техогляд, права...">
      <input id="remDate" type="date">
      <button onclick="addRem()">Додати</button>
    </div>
    <div id="remList"></div>
  </div>
</div>

<div class="page" id="p-fuel">
  <div class="wrap">
    <select id="fuelCar" onchange="render()"></select>
    <div class="card">
      <b>Заправка</b>
      <input id="fuelDate" type="date">
      <input id="fuelKm" placeholder="Пробіг" inputmode="numeric">
      <input id="fuelL" placeholder="Літри" inputmode="decimal">
      <input id="fuelSum" placeholder="Сума" inputmode="numeric">
      <button onclick="addFuel()">Додати</button>
    </div>
    <div id="fuelStats" class="muted" style="margin-bottom:8px;"></div>
    <div id="fuelList"></div>
  </div>
</div>

<div class="page" id="p-km">
  <div class="wrap">
    <div class="card">
      <b>Калькулятор витрати</b>
      <input id="calcDist" placeholder="Відстань, км" inputmode="decimal">
      <input id="calcAvg" placeholder="Середня витрата, л/100 км" inputmode="decimal">
      <input id="calcLiters" placeholder="Або літри" inputmode="decimal">
      <button onclick="calcFuel()">Розрахувати</button>
      <div id="calcResult" class="muted" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <b>День</b>
      <select id="kmCar"></select>
      <input id="kmDate" type="date">
      <input id="kmValue" placeholder="Пробіг за день, км" inputmode="decimal">
      <input id="kmFuel" placeholder="Заправлено, л" inputmode="decimal">
      <select id="kmNote">
        <option value="">Маршрут зі списку</option>
        <option>Ірпінь - Макарів</option>
        <option>БЦ</option>
        <option>БЦ - Фастів</option>
        <option>БЦ - Сквира</option>
        <option>Фастів</option>
        <option>Фастів - Гребінки</option>
        <option>Ірпінь - Буча - Гостомель</option>
        <option>Ірпінь</option>
        <option>Офіс Жуляни</option>
        <option>Офіс Вишневе</option>
        <option>Іванків</option>
        <option>Іванків - Вишгород</option>
      </select>
      <textarea id="kmNoteCustom" placeholder="Свій коментар" rows="2"></textarea>
      <input id="kmPhoto" type="file" accept="image/*">
      <button onclick="addKm()">Додати день</button>
    </div>
    <div class="card">
      <b>Звіт за місяць</b>
      <input id="monthPick" type="month">
      <div class="btns">
        <button class="ghost" onclick="saveMonthReport('html')">HTML</button>
        <button class="ghost" onclick="saveMonthReport('excel')">Звіт з фото</button>
        <button class="ghost" onclick="saveMonthReport('view')">Переглянути</button>
      </div>
    </div>
    <div id="kmChart" style="margin:12px 0;"></div>
    <div id="kmTotals" class="muted" style="margin-bottom:8px;"></div>
    <div id="kmList"></div>
  </div>
</div>

<nav style="display:none;"></nav>
<div id="menuBtn" onclick="toggleMenu()" style="position:fixed;top:12px;right:12px;z-index:30;width:42px;height:42px;border-radius:12px;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;">☰</div>
<div id="menuOverlay" onclick="toggleMenu()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;"></div>
<div id="menu" style="display:none;position:fixed;top:0;left:0;bottom:0;width:280px;z-index:26;background:#1e2937;color:#fff;padding:16px 12px;overflow:auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <b style="font-size:18px;">Меню</b>
    <button onclick="toggleMenu()" style="background:transparent;color:#fff;border:0;font-size:22px;">✕</button>
  </div>
  <button onclick="openTab('p-cars')" style="width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:14px 8px;font-size:16px;border-bottom:1px solid #334155;">Авто</button>
  <button onclick="openTab('p-service')" style="width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:14px 8px;font-size:16px;border-bottom:1px solid #334155;">ТО</button>
  <button onclick="openTab('p-remind')" style="width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:14px 8px;font-size:16px;border-bottom:1px solid #334155;">Терміни</button>
  <button onclick="openTab('p-fuel')" style="width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:14px 8px;font-size:16px;border-bottom:1px solid #334155;">Паливо</button>
  <button onclick="openTab('p-km')" style="width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:14px 8px;font-size:16px;border-bottom:1px solid #334155;">Пробіг</button>
</div>

<script>
const KEY = 'auto_book_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{"cars":[],"services":[],"rems":[],"fuels":[],"kms":[]}');
if (!state.kms) state.kms = [];
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = (v) => {
  const s = String(v || '').replace(',', '.').trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const today = () => new Date().toISOString().slice(0,10);

const CARS = [
  ['Skoda','Octavia','1996–'],['Skoda','Fabia','1999–'],['Skoda','Superb','2001–'],['Skoda','Rapid','2012–'],['Skoda','Kodiaq','2016–'],['Skoda','Karoq','2017–'],
  ['Volkswagen','Golf','1974–'],['Volkswagen','Passat','1973–'],['Volkswagen','Polo','1975–'],['Volkswagen','Tiguan','2007–'],['Volkswagen','Touareg','2002–'],['Volkswagen','Caddy','1979–'],['Volkswagen','Transporter','1950–'],
  ['Toyota','Corolla','1966–'],['Toyota','Camry','1982–'],['Toyota','RAV4','1994–'],['Toyota','Land Cruiser','1951–'],['Toyota','Prius','1997–'],['Toyota','Yaris','1999–'],['Toyota','Avensis','1997–2018'],
  ['Hyundai','i30','2007–'],['Hyundai','Tucson','2004–'],['Hyundai','Elantra','1990–'],['Hyundai','Santa Fe','2000–'],['Hyundai','Accent','1994–'],['Hyundai','Sonata','1985–'],
  ['Kia','Ceed','2006–'],['Kia','Sportage','1993–'],['Kia','Rio','1999–'],['Kia','Sorento','2002–'],['Kia','Optima','2000–'],['Kia','Picanto','2004–'],
  ['Renault','Megane','1995–'],['Renault','Logan','2004–'],['Renault','Duster','2010–'],['Renault','Scenic','1996–'],['Renault','Kangoo','1997–'],['Renault','Captur','2013–'],
  ['Nissan','Qashqai','2006–'],['Nissan','X-Trail','2000–'],['Nissan','Juke','2010–'],['Nissan','Note','2004–'],['Nissan','Almera','1995–'],['Nissan','Leaf','2010–'],
  ['Ford','Focus','1998–'],['Ford','Fiesta','1976–'],['Ford','Mondeo','1993–'],['Ford','Kuga','2008–'],['Ford','Transit','1965–'],['Ford','Fusion','2002–'],
  ['Opel','Astra','1991–'],['Opel','Corsa','1982–'],['Opel','Insignia','2008–'],['Opel','Zafira','1999–'],['Opel','Vectra','1988–2008'],['Opel','Mokka','2012–'],
  ['Chevrolet','Aveo','2002–'],['Chevrolet','Lacetti','2002–'],['Chevrolet','Cruze','2008–'],['Chevrolet','Captiva','2006–'],['Chevrolet','Spark','1998–'],
  ['Daewoo','Lanos','1997–'],['Daewoo','Nexia','1994–'],['Daewoo','Matiz','1998–'],['ZAZ','Sens','2000–'],['ZAZ','Lanos','2005–'],
  ['Mercedes-Benz','C-Class','1993–'],['Mercedes-Benz','E-Class','1993–'],['Mercedes-Benz','S-Class','1972–'],['Mercedes-Benz','GLC','2015–'],['Mercedes-Benz','Sprinter','1995–'],
  ['BMW','3 Series','1975–'],['BMW','5 Series','1972–'],['BMW','X5','1999–'],['BMW','X3','2003–'],['BMW','1 Series','2004–'],
  ['Audi','A4','1994–'],['Audi','A6','1994–'],['Audi','Q5','2008–'],['Audi','A3','1996–'],['Audi','Q7','2005–'],
  ['Mazda','3','2003–'],['Mazda','6','2002–'],['Mazda','CX-5','2012–'],['Mazda','CX-3','2015–'],
  ['Honda','Civic','1972–'],['Honda','CR-V','1995–'],['Honda','Accord','1976–'],['Honda','Jazz','2001–'],
  ['Mitsubishi','Outlander','2001–'],['Mitsubishi','Lancer','1973–'],['Mitsubishi','ASX','2010–'],['Mitsubishi','Pajero','1982–'],
  ['Peugeot','308','2007–'],['Peugeot','3008','2008–'],['Peugeot','208','2012–'],['Peugeot','Partner','1996–'],
  ['Citroen','C4','2004–'],['Citroen','Berlingo','1996–'],['Citroen','C5','2001–'],
  ['Volvo','XC60','2008–'],['Volvo','XC90','2002–'],['Volvo','S60','2000–'],['Volvo','V40','1995–'],
  ['Subaru','Forester','1997–'],['Subaru','Outback','1994–'],['Subaru','Impreza','1992–'],
  ['Suzuki','Vitara','1988–'],['Suzuki','SX4','2006–'],['Suzuki','Swift','1983–'],
  ['Dacia','Logan','2004–'],['Dacia','Duster','2010–'],['Dacia','Sandero','2007–'],
  ['Tesla','Model 3','2017–'],['Tesla','Model Y','2020–'],['Tesla','Model S','2012–'],
  ['SEAT','Ibiza','1984–'],['SEAT','Leon','1999–'],['SEAT','Toledo','1991–'],['SEAT','Altea','2004–2015'],['SEAT','Arona','2017–'],['SEAT','Ateca','2016–'],['SEAT','Tarraco','2018–'],['SEAT','Cordoba','1993–2009'],['SEAT','Alhambra','1996–'],['SEAT','Exeo','2008–2013']
];

function searchCars() {
  const q = (document.getElementById('carSearch').value || '').toLowerCase().trim();
  const box = document.getElementById('carResults');
  if (!q) { box.innerHTML = ''; return; }
  const found = CARS.filter(([b,m]) => (b + ' ' + m).toLowerCase().includes(q)).slice(0, 20);
  box.innerHTML = found.map(([b,m,y]) => `
    <div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="pickCar('${b} ${m}','${y}')">
      <div><b>${b} ${m}</b><div class="muted">${y}</div></div>
      <span class="muted">обрати</span>
    </div>`).join('') || '<div class="muted">Нічого не знайдено</div>';
}

function pickCar(name, years) {
  document.getElementById('carName').value = name;
  const y = (years.match(/\d{4}/) || [''])[0];
  document.getElementById('carYear').value = y;
  document.getElementById('carSearch').value = '';
  document.getElementById('carResults').innerHTML = '';
}

function addCar() {
  const name = carName.value.trim();
  if (!name) return;
  state.cars.push({ id: uid(), name, plate: carPlate.value.trim(), year: carYear.value.trim() });
  carName.value = carPlate.value = carYear.value = '';
  save(); render();
}
const CATALOG = {
  to: [
    'Заміна масла в двигуні',
    'Масляний фільтр',
    'Повітряний фільтр',
    'Салонний фільтр',
    'Паливний фільтр',
    'Свічки запалювання',
    'Свічки розжарювання',
    'Промивання двигуна',
    'Чистка дроселя',
    'Заміна ламп'
  ],
  hodova: [
    'Амортизатори передні',
    'Амортизатори задні',
    'Пружини',
    'Опори амортизаторів',
    'Опорні підшипники',
    'Сайлентблоки важелів',
    'Кульові опори',
    'Важелі підвіски',
    'Стійки стабілізатора',
    'Втулки стабілізатора',
    'Рульові наконечники',
    'Рульові тяги',
    'Підшипники маточини',
    'ШРУС зовнішній',
    'ШРУС внутрішній',
    'Пильники ШРУСа',
    'Розвал-сходження'
  ],
  galma: [
    'Колодки передні',
    'Колодки задні',
    'Диски передні',
    'Диски задні',
    'Барабанні колодки',
    'Гальмівна рідина',
    'Гальмівні шланги',
    'Супорт / ремкомплект',
    'Ручник'
  ],
  ridyny: [
    'Антифриз',
    'Рідина ГУР',
    'Масло МКПП',
    'Масло АКПП',
    'Масло редуктора / моста',
    'Ремінь ГРМ + ролики',
    'Помпа',
    'Ланцюг ГРМ',
    'Ремінь генератора',
    'Ролики приводу'
  ],
  inshi: [
    'Акумулятор',
    'Щітки склоочисника',
    'Діагностика',
    'Інше'
  ]
};

let pickedItems = [];

function renderChecks() {
  const type = document.getElementById('svcType')?.value || 'to';
  const box = document.getElementById('svcChecks');
  if (!box) return;
  box.innerHTML = (CATALOG[type] || []).map(name => `
    <label><input type="checkbox" value="${name}" ${pickedItems.includes(name) ? 'checked' : ''} onchange="toggleItem(this)"> ${name}</label>
  `).join('');
  showPicked();
}
function toggleItem(el) {
  if (el.checked) {
    if (!pickedItems.includes(el.value)) pickedItems.push(el.value);
  } else {
    pickedItems = pickedItems.filter(x => x !== el.value);
  }
  showPicked();
}
function viewPicked() {
  const box = document.getElementById('pickedBox');
  if (!pickedItems.length) {
    box.textContent = 'Поки нічого не обрано';
    return;
  }
  box.innerHTML = '<b>Обрано:</b><br>' + pickedItems.map((x,i) => (i+1) + '. ' + x).join('<br>');
}
function showPicked() {
  const box = document.getElementById('pickedBox');
  if (!box) return;
  box.textContent = pickedItems.length ? 'Обрано: ' + pickedItems.join(', ') : '';
}

function addService() {
  if (!svcCar.value) return;
  const note = document.getElementById('svcNote').value.trim();
  if (!pickedItems.length && !note) return alert('Оберіть хоча б одну позицію або напишіть примітку');
  const what = [...pickedItems, note].filter(Boolean).join(' · ');
  const date = document.getElementById('svcDate').value || today();
  const file = document.getElementById('svcPhoto').files[0];
  const finish = (photo) => {
    if (!state.services) state.services = [];
    state.services.push({
      id: uid() + '-' + state.services.length,
      carId: String(svcCar.value),
      date: String(date),
      km: num(document.getElementById('svcKm').value),
      items: [...pickedItems],
      what,
      cost: num(document.getElementById('svcCost').value),
      photo: photo || ''
    });
    document.getElementById('svcNote').value = '';
    document.getElementById('svcKm').value = '';
    document.getElementById('svcCost').value = '';
    document.getElementById('svcPhoto').value = '';
    pickedItems = [];
    renderChecks();
    const ok = trySave();
    if (!ok) {
      state.services.pop();
      alert('Не вистачає місця. Спробуй без великого фото.');
      return;
    }
    render();
  };
  if (file) compressImage(file, finish);
  else finish('');
}
function addRem() {
  if (!remTitle.value.trim() || !remDate.value) return;
  state.rems.push({ id: uid(), title: remTitle.value.trim(), date: remDate.value });
  remTitle.value = ''; save(); render();
}
function addFuel() {
  if (!fuelCar.value) return;
  state.fuels.push({ id: uid(), carId: fuelCar.value, date: fuelDate.value || today(), km: +fuelKm.value || 0, liters: +fuelL.value || 0, sum: +fuelSum.value || 0 });
  fuelKm.value = fuelL.value = fuelSum.value = '';
  save(); render();
}
function calcFuel() {
  const dist = num(document.getElementById('calcDist').value);
  const avg = num(document.getElementById('calcAvg').value);
  const litersIn = num(document.getElementById('calcLiters').value);
  const out = document.getElementById('calcResult');
  if (avg <= 0) { out.textContent = 'Вкажи середню витрату'; return; }
  if (dist > 0) {
    const liters = dist * avg / 100;
    out.textContent = `На ${dist} км потрібно приблизно ${liters.toFixed(1)} л`;
  } else if (litersIn > 0) {
    const can = litersIn / avg * 100;
    out.textContent = `На ${litersIn} л можна проїхати приблизно ${can.toFixed(0)} км`;
  } else {
    out.textContent = 'Вкажи відстань або літри';
  }
}
function compressImage(file, done) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      done(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => done('');
    img.src = r.result;
  };
  r.onerror = () => done('');
  r.readAsDataURL(file);
}
function addKm() {
  const carSel = document.getElementById('kmCar');
  const carId = (carSel && carSel.value) || (state.cars[0] && state.cars[0].id);
  if (!carId) return alert('Спочатку додай авто');
  const km = num(document.getElementById('kmValue').value);
  const fuel = num(document.getElementById('kmFuel').value);
  const route = document.getElementById('kmNote').value;
  const custom = document.getElementById('kmNoteCustom').value.trim();
  const note = [route, custom].filter(Boolean).join(' · ');
  const dateEl = document.getElementById('kmDate');
  const date = (dateEl && dateEl.value) || today();
  const file = document.getElementById('kmPhoto').files[0];
  const finish = (photo) => {
    if (!state.kms) state.kms = [];
    const item = {
      id: uid() + '-' + state.kms.length,
      carId: String(carId),
      date: String(date),
      km, fuel, note, photo: photo || ''
    };
    state.kms.push(item);
    const ok = trySave();
    if (!ok && photo) {
      item.photo = '';
      if (!trySave()) {
        state.kms.pop();
        alert('Не вистачає місця. Видали старі записи з великими фото.');
        return;
      }
    } else if (!ok) {
      state.kms.pop();
      alert('Не вистачає місця в пам’яті телефону.');
      return;
    }
    document.getElementById('kmValue').value = '';
    document.getElementById('kmFuel').value = '';
    document.getElementById('kmNoteCustom').value = '';
    document.getElementById('kmNote').value = '';
    document.getElementById('kmPhoto').value = '';
    render();
  };
  if (file) compressImage(file, finish);
  else finish('');
}
function trySave() {
  try { save(); return true; } catch (e) { return false; }
}
function backup() {
  const data = JSON.stringify(state, null, 2);
  downloadFile('auto-backup.json', data, 'application/json');
}
function restore(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.cars)) throw new Error('bad');
      state = {
        cars: data.cars || [],
        services: data.services || [],
        rems: data.rems || [],
        fuels: data.fuels || [],
        kms: data.kms || []
      };
      save();
      render();
      alert('Бекап відновлено');
    } catch (e) {
      alert('Не вдалося прочитати файл');
    }
    input.value = '';
  };
  r.readAsText(file);
}
function downloadFile(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name;
  a.click();
}

function daysLeft(date) {
  const d = Math.ceil((new Date(date) - new Date(today())) / 86400000);
  return d;
}

function render() {
  document.getElementById('cars').innerHTML = state.cars.map(c => `
    <div class="card">
      <div class="row">
        <b>${c.name}</b>
        <div class="btns">
          <button class="ghost" onclick="editCar('${c.id}')">Змінити</button>
          <button class="danger" onclick="if(confirm('Видалити це авто?')) del('cars','${c.id}')">Видалити</button>
        </div>
      </div>
      <div class="muted">${c.plate || 'без номера'} · ${c.year || '—'}</div>
    </div>`).join('') || '<div class="muted">Додай перше авто</div>';

  const opts = state.cars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const prevSvc = svcCar.value;
  const prevFuel = fuelCar.value;
  const prevKm = document.getElementById('kmCar') ? kmCar.value : '';
  svcCar.innerHTML = opts;
  fuelCar.innerHTML = opts;
  if (document.getElementById('kmCar')) {
    kmCar.innerHTML = opts;
    if (prevKm && [...kmCar.options].some(o => o.value === prevKm)) kmCar.value = prevKm;
  }
  if (prevSvc && [...svcCar.options].some(o => o.value === prevSvc)) svcCar.value = prevSvc;
  if (prevFuel && [...fuelCar.options].some(o => o.value === prevFuel)) fuelCar.value = prevFuel;

  const sid = svcCar.value;
  const svcs = state.services.filter(s => String(s.carId) === String(sid)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const svcMonths = {};
  svcs.forEach(s => {
    const m = (s.date || '').slice(0,7);
    if (!svcMonths[m]) svcMonths[m] = [];
    svcMonths[m].push(s);
  });
  document.getElementById('svcList').innerHTML = Object.keys(svcMonths).sort().reverse().map(m => {
    const list = svcMonths[m];
    const total = list.reduce((s,x)=>s+(+x.cost||0),0);
    const cards = list.map(s => `
      <div class="card" style="margin-top:8px;">
        <div class="row"><b>${s.what}</b><button class="danger" onclick="del('services','${s.id}')">✕</button></div>
        <div class="muted">${s.date} · ${s.km||0} км · ${s.cost||0} грн</div>
        ${s.photo ? `<img src="${s.photo}" style="max-width:100%;border-radius:10px;margin-top:8px;">` : ''}
      </div>
    `).join('');
    return `<div class="card"><b>${m}</b><div class="muted">${list.length} запис(ів) · ${total} грн</div>${cards}</div>`;
  }).join('') || '<div class="muted">Записів немає</div>';

  document.getElementById('remList').innerHTML = state.rems.sort((a,b)=>a.date.localeCompare(b.date)).map(r => {
    const d = daysLeft(r.date);
    const cls = d < 0 ? 'warn' : d <= 30 ? 'warn' : 'ok';
    const txt = d < 0 ? `прострочено ${-d} дн.` : `через ${d} дн.`;
    return `<div class="card"><div class="row"><div><b>${r.title}</b><div class="${cls}">${r.date} · ${txt}</div></div><button class="danger" onclick="del('rems','${r.id}')">✕</button></div></div>`;
  }).join('') || '<div class="muted">Немає термінів</div>';

  const fid = fuelCar.value;
  const fuels = state.fuels.filter(f => f.carId === fid).sort((a,b)=>a.km-b.km);
  let fuelAvg = '—';
  if (fuels.length >= 2) {
    const first = fuels[0], last = fuels[fuels.length-1];
    const km = last.km - first.km;
    const liters = fuels.slice(1).reduce((s,f)=>s+f.liters,0);
    if (km > 0 && liters > 0) fuelAvg = (liters / km * 100).toFixed(1) + ' л/100 км';
  }
  document.getElementById('fuelStats').textContent = 'Середня витрата: ' + fuelAvg;
  document.getElementById('fuelList').innerHTML = [...fuels].reverse().map(f => `
    <div class="card"><div class="row"><div>${f.date} · ${f.km} км<br><span class="muted">${f.liters} л · ${f.sum} грн</span></div><button class="danger" onclick="del('fuels','${f.id}')">✕</button></div></div>
  `).join('') || '<div class="muted">Заправок немає</div>';

  const kid = document.getElementById('kmCar') ? kmCar.value : '';
  const kms = (state.kms || []).filter(k => String(k.carId) === String(kid)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const sumKm = kms.reduce((s,k)=>s+ (+k.km||0), 0);
  const sumFuel = kms.reduce((s,k)=>s+ (+k.fuel||0), 0);
  const kmAvg = sumKm > 0 && sumFuel > 0 ? (sumFuel / sumKm * 100).toFixed(1) : '—';
  document.getElementById('kmTotals').textContent = `Разом: ${sumKm} км · ${sumFuel.toFixed(1)} л · середнє ${kmAvg} л/100 км`;
  drawKmChart(kms);
  const months = {};
  kms.forEach(k => {
    const m = (k.date || '').slice(0,7);
    if (!months[m]) months[m] = [];
    months[m].push(k);
  });
  document.getElementById('kmList').innerHTML = Object.keys(months).sort().reverse().map(m => {
    const days = months[m];
    const mKm = days.reduce((s,k)=>s+(+k.km||0),0);
    const mFuel = days.reduce((s,k)=>s+(+k.fuel||0),0);
    const dayHtml = days.map(k => `
      <div style="margin:8px 0;border:1px solid #e7e5e4;border-radius:12px;background:#fff;overflow:hidden;">
        <button type="button" onclick="toggleDay('${k.id}')" style="width:100%;text-align:left;background:#fff;color:#1c1917;border:0;padding:12px;font-size:15px;">
          ${k.date} · ${k.km||0} км · ${k.fuel||0} л
        </button>
        <div id="day-${k.id}" style="display:none;padding:0 12px 12px;color:#1c1917;">
          <div style="color:#78716c;">${k.note || 'без примітки'}</div>
          ${k.photo ? `<img src="${k.photo}" style="max-width:100%;border-radius:10px;margin-top:8px;">` : '<div style="color:#78716c;margin-top:6px;">Фото немає</div>'}
          <div class="btns" style="margin-top:8px;">
            <button class="ghost" type="button" onclick="editKm('${k.id}')">Змінити</button>
            <button class="danger" type="button" onclick="delKm('${k.id}')">Видалити</button>
          </div>
        </div>
      </div>
    `).join('');
    return `<div class="card"><b>${m}</b><div class="muted">За місяць: ${mKm} км · ${mFuel.toFixed(1)} л</div>${dayHtml}</div>`;
  }).join('') || '<div class="muted">Записів немає</div>';
}

function del(list, id) {
  state[list] = (state[list] || []).filter(x => x.id !== id);
  save(); render();
}
function toggleDay(id) {
  const el = document.getElementById('day-' + id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function drawKmChart(kms) {
  const box = document.getElementById('kmChart');
  if (!box) return;
  const current = today().slice(0,7);
  const days = kms.filter(k => (k.date||'').startsWith(current)).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if (!days.length) { box.innerHTML = ''; return; }
  const max = Math.max(...days.map(d => +d.km||0), 1);
  const bars = days.map(d => {
    const h = Math.max(4, Math.round((+d.km||0) / max * 120));
    return `<div style="display:flex;flex-direction:column;align-items:center;width:28px;">
      <div style="font-size:10px;">${d.km||0}</div>
      <div style="width:18px;height:${h}px;background:#1c1c1e;border-radius:6px 6px 2px 2px;"></div>
      <div style="font-size:10px;margin-top:4px;">${(d.date||'').slice(8)}</div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="card"><b>Пробіг за ${current}</b>
    <div style="display:flex;align-items:flex-end;gap:6px;overflow:auto;padding-top:8px;">${bars}</div></div>`;
}
function editCar(id) {
  const car = state.cars.find(c => c.id === id);
  if (!car) return;
  const name = prompt('Назва', car.name || '');
  if (name === null) return;
  const plate = prompt('Номер', car.plate || '');
  if (plate === null) return;
  const year = prompt('Рік', car.year || '');
  if (year === null) return;
  car.name = name.trim() || car.name;
  car.plate = plate.trim();
  car.year = year.trim();
  save(); render();
}
function delKm(id) {
  if (!confirm('Видалити цей день?')) return;
  state.kms = (state.kms || []).filter(k => k.id !== id);
  save();
  render();
}
function editKm(id) {
  const item = (state.kms || []).find(k => k.id === id);
  if (!item) return;
  const date = prompt('Дата (рррр-мм-дд)', item.date || '');
  if (date === null) return;
  const km = prompt('Пробіг, км', item.km || 0);
  if (km === null) return;
  const fuel = prompt('Заправлено, л', item.fuel || 0);
  if (fuel === null) return;
  const note = prompt('Маршрут / примітка', item.note || '');
  if (note === null) return;
  item.date = date.trim() || item.date;
  item.km = num(km);
  item.fuel = num(fuel);
  item.note = note.trim();
  save();
  render();
}
function toggleMenu() {
  const m = document.getElementById('menu');
  const o = document.getElementById('menuOverlay');
  const open = m.style.display === 'none';
  m.style.display = open ? 'block' : 'none';
  o.style.display = open ? 'block' : 'none';

function openTab(id) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('menu').style.display = 'none';
  document.getElementById('menuOverlay').style.display = 'none';
